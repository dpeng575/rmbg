<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================================
   裁云 rmbg · Apple 官网风格设计 tokens
   白底 · 近黑文字 · 单一品牌蓝 · 灰阶层级 · 药丸 CTA
   ============================================================ */

/* —— 语义别名（apply-html-head-contract 依赖） —— */
:root {
  --cy-background: #ffffff;
  --cy-foreground: #1d1d1f;

  --cy-card: #ffffff;
  --cy-card-foreground: #1d1d1f;

  --cy-popover: #ffffff;
  --cy-popover-foreground: #1d1d1f;

  --cy-primary: #0071e3;
  --cy-primary-foreground: #ffffff;
  --cy-primary-hover: #0077ed; /* 同色相明度步进，仅 hover */
  --cy-primary-tint: #2997ff;  /* 深色分区上的链接蓝（同色相提亮） */

  --cy-muted: #f5f5f7;
  --cy-muted-foreground: #6e6e73;

  --cy-border: #d2d2d7;
  --cy-input: #ffffff;
  --cy-ring: #0071e3;

  /* 深色产品分区（Apple 黑色 section） */
  --cy-surface-dark: #1d1d1f;
  --cy-on-dark: #f5f5f7;
  --cy-on-dark-soft: #86868b;
  --cy-hairline-dark: rgba(255, 255, 255, 0.18);

  /* 弱化层级 */
  --cy-ink-soft: #6e6e73;
  --cy-ink-faint: #86868b;
  --cy-hairline: #d2d2d7;

  /* 圆角：药丸之外仅两档 */
  --cy-radius-sm: 8px;
  --cy-radius-md: 12px;
  --cy-radius-lg: 18px;
  --cy-radius-pill: 980px;

  /* 阴影：仅静态极浅一层 + 浮层一层 */
  --cy-shadow-card: 0 4px 18px rgba(0, 0, 0, 0.04);
  --cy-shadow-float: 0 12px 32px rgba(0, 0, 0, 0.12);

  /* 字体：SF Pro / PingFang SC 系统栈 */
  --cy-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans",
    "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
}

/* Apple 式排版基元 */
:root {
  --cy-display: clamp(48px, 6.5vw, 80px);
  --cy-headline: clamp(32px, 4vw, 48px);
  --cy-title: clamp(21px, 2.2vw, 28px);
  --cy-body: 17px;
  --cy-caption: 12px;
  --cy-nav: 12px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--cy-background);
    --color-foreground: var(--cy-foreground);
    --color-card: var(--cy-card);
    --color-card-foreground: var(--cy-card-foreground);
    --color-popover: var(--cy-popover);
    --color-popover-foreground: var(--cy-popover-foreground);
    --color-primary: var(--cy-primary);
    --color-primary-foreground: var(--cy-primary-foreground);
    --color-muted: var(--cy-muted);
    --color-muted-foreground: var(--cy-muted-foreground);
    --color-border: var(--cy-border);
    --color-input: var(--cy-input);
    --color-ring: var(--cy-ring);
    --radius-sm: var(--cy-radius-sm);
    --radius-md: var(--cy-radius-md);
    --radius-lg: var(--cy-radius-lg);
  }
  @layer base {
    body { background: var(--cy-background); color: var(--cy-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--cy-background); }
      .text-background { color: var(--cy-background); }
      .border-background { border-color: var(--cy-background); }
      .ring-background { --tw-ring-color: var(--cy-background); }
      .bg-foreground { background-color: var(--cy-foreground); }
      .text-foreground { color: var(--cy-foreground); }
      .border-foreground { border-color: var(--cy-foreground); }
      .ring-foreground { --tw-ring-color: var(--cy-foreground); }
      .bg-card { background-color: var(--cy-card); }
      .text-card { color: var(--cy-card); }
      .border-card { border-color: var(--cy-card); }
      .ring-card { --tw-ring-color: var(--cy-card); }
      .bg-card-foreground { background-color: var(--cy-card-foreground); }
      .text-card-foreground { color: var(--cy-card-foreground); }
      .border-card-foreground { border-color: var(--cy-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--cy-card-foreground); }
      .bg-popover { background-color: var(--cy-popover); }
      .text-popover { color: var(--cy-popover); }
      .border-popover { border-color: var(--cy-popover); }
      .ring-popover { --tw-ring-color: var(--cy-popover); }
      .bg-popover-foreground { background-color: var(--cy-popover-foreground); }
      .text-popover-foreground { color: var(--cy-popover-foreground); }
      .border-popover-foreground { border-color: var(--cy-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--cy-popover-foreground); }
      .bg-primary { background-color: var(--cy-primary); }
      .text-primary { color: var(--cy-primary); }
      .border-primary { border-color: var(--cy-primary); }
      .ring-primary { --tw-ring-color: var(--cy-primary); }
      .bg-primary-foreground { background-color: var(--cy-primary-foreground); }
      .text-primary-foreground { color: var(--cy-primary-foreground); }
      .border-primary-foreground { border-color: var(--cy-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--cy-primary-foreground); }
      .bg-muted { background-color: var(--cy-muted); }
      .text-muted { color: var(--cy-muted); }
      .border-muted { border-color: var(--cy-muted); }
      .ring-muted { --tw-ring-color: var(--cy-muted); }
      .bg-muted-foreground { background-color: var(--cy-muted-foreground); }
      .text-muted-foreground { color: var(--cy-muted-foreground); }
      .border-muted-foreground { border-color: var(--cy-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--cy-muted-foreground); }
      .bg-border { background-color: var(--cy-border); }
      .text-border { color: var(--cy-border); }
      .border-border { border-color: var(--cy-border); }
      .ring-border { --tw-ring-color: var(--cy-border); }
      .bg-input { background-color: var(--cy-input); }
      .text-input { color: var(--cy-input); }
      .border-input { border-color: var(--cy-input); }
      .ring-input { --tw-ring-color: var(--cy-input); }
      .bg-ring { background-color: var(--cy-ring); }
      .text-ring { color: var(--cy-ring); }
      .border-ring { border-color: var(--cy-ring); }
      .ring-ring { --tw-ring-color: var(--cy-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
